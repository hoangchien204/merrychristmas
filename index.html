<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pink Christmas - Hello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020101;
            touch-action: none;
            font-family: 'Cinzel', serif;
        }

        canvas {
            display: block;
            outline: none;
        }

        /* Màn hình chờ Start Screen */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #020101;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }

        #helloBtn {
            background: transparent;
            color: #ffccdd;
            border: 1px solid #ffccdd;
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Great Vibes', cursive;
            cursor: pointer;
            letter-spacing: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 204, 221, 0.2);
        }

        #helloBtn:hover {
            background: #ffccdd;
            color: #020101;
            box-shadow: 0 0 30px rgba(255, 204, 221, 0.5);
        }

        .hint {
            margin-top: 20px;
            color: #444;
            font-size: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div id="startScreen">
        <button id="helloBtn">Hello</button>
        <div class="hint">CLICK TO START EXPERIENCE</div>
    </div>

    <audio id="bgMusic" src="./audio.mp3" loop></audio>

    <div style="font-family: 'Great Vibes'; opacity: 0; position: absolute; pointer-events: none;">.</div>
    <div style="font-family: 'Cinzel'; opacity: 0; position: absolute; pointer-events: none;">.</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CẤU HÌNH ---
        const CONFIG = {
            treeHeight: 75, baseRadius: 42,
            layers: 16, branches: 8, particlesPerLayer: 4500,
            huePink: 0.92, hueGold: 0.11, hueGreen: 0.32,
            treeStartTimeOffset: 3.5,
            treeCoalesceSpeed: 3.5,
            introDuration: 7.0,
            subtitles: [
                "Hế nhô người đẹp",
                "Giáng sinh vui vẻ\nnhé",
                "Một món quà nho nhỏ\ntặng người đẹp nha",
                "Không to tát\nnhưng mong người đẹp thích",
            ],
            subtitleSwitchTime: 3.0,
            snowCount: 3000,
            snowRange: 1000
        };

        const DOC_PADDING_LEFT = 50;
        let scene, camera, renderer, controls, composer;
        let contentGroup, textGroup, subtitleGroup, snowSystem;
        let musicStarted = false;

        const clock = new THREE.Clock(false); // Chưa đếm ngay
        const music = document.getElementById('bgMusic');
        const startScreen = document.getElementById('startScreen');
        const helloBtn = document.getElementById('helloBtn');

        const particleTexture = createParticleTexture();
        const snowflakeTexture = createSnowflakeTexture();

        let currentSubtitleIndex = 0;
        let lastSubtitleSwitchTime = 0;
        let activeSubtitles = [];
        let isIntroFinished = false;
        let targetCamPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();

        // Sự kiện bắt đầu
        helloBtn.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                clock.start(); // Bắt đầu đếm thời gian
                init();
                animate();
            }, 1000);
        });

        function createSnowflakeTexture() {
            const canvas = document.createElement('canvas');
            const size = 128; canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d'); const center = size / 2;
            ctx.clearRect(0, 0, size, size);
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, size / 2);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(center, center, size / 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
            for (let i = 0; i < 6; i++) {
                ctx.save(); ctx.translate(center, center); ctx.rotate(i * Math.PI / 3);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, size * 0.4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, size * 0.25); ctx.lineTo(-size * 0.1, size * 0.35);
                ctx.moveTo(0, size * 0.25); ctx.lineTo(size * 0.1, size * 0.35); ctx.stroke();
                ctx.restore();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas'); const size = 64; canvas.width = size; canvas.height = size;
            const context = canvas.getContext('2d'); const center = size / 2;
            context.clearRect(0, 0, size, size);
            const gradient = context.createRadialGradient(center, center, 0, center, center, size / 2);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            context.fillStyle = gradient; context.beginPath(); context.arc(center, center, size / 2, 0, Math.PI * 2); context.fill();
            context.beginPath(); context.arc(center, center, size / 6, 0, Math.PI * 2); context.fillStyle = '#fff'; context.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createTitleMesh() {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 512;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';

            // Xóa shadow hồng để chữ trắng sạch
            ctx.shadowBlur = 0;

            ctx.font = 'bold 120px "Great Vibes", cursive';
            ctx.fillText("Merry", DOC_PADDING_LEFT, 150);
            ctx.font = 'bold 120px "Great Vibes", cursive';
            ctx.fillText("Christmas", DOC_PADDING_LEFT, 300);

            const tex = new THREE.CanvasTexture(canvas); tex.minFilter = THREE.LinearFilter;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
            const geo = new THREE.PlaneGeometry(160, 80);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, 18, 0);
            return mesh;
        }

        function spawnSubtitle(textStr) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 256;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '50px "Times New Roman", serif'; ctx.fillStyle = '#ffccdd';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            const lines = textStr.split('\n');
            const lineHeight = 70;
            lines.forEach((line, i) => {
                ctx.fillText(line, DOC_PADDING_LEFT, 10 + i * lineHeight);
            });
            const tex = new THREE.CanvasTexture(canvas); tex.minFilter = THREE.LinearFilter;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
            const geo = new THREE.PlaneGeometry(160, 40);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, -25, 0);
            subtitleGroup.add(mesh);
            activeSubtitles.push({ mesh, state: 'entering', life: 0 });
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050202);
            scene.fog = new THREE.FogExp2(0x050202, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.set(0, 100, 900);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
            controls.minDistance = 10; controls.maxDistance = 900;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.enabled = false;

            contentGroup = new THREE.Group();
            scene.add(contentGroup);

            createSymmetricalTree();
            createHeart();
            createBigRipples();
            createBackgroundDust();
            createFallingSnow();

            textGroup = new THREE.Group();
            scene.add(textGroup);

            const titleMesh = createTitleMesh();
            titleMesh.userData.isTitle = true;
            textGroup.add(titleMesh);

            subtitleGroup = new THREE.Group();
            textGroup.add(subtitleGroup);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1; bloomPass.strength = 1.5; bloomPass.radius = 0.8;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            calculateLayoutTargets();
            window.addEventListener('resize', onWindowResize);
        }

        function calculateLayoutTargets() {
            const aspect = window.innerWidth / window.innerHeight;
            const isMobile = aspect < 1.0;
            if (isMobile) {
                contentGroup.position.set(-25, -5, 0);
                textGroup.position.set(50, 10, 0);
                textGroup.scale.set(0.6, 0.6, 0.6);
                targetCamPos.set(0, 10, 190);
                targetLookAt.set(0, 5, 0);
            } else {
                contentGroup.position.set(-45, 0, 0);
                textGroup.position.set(50, CONFIG.treeHeight / 2 - 5, 0);
                textGroup.scale.set(1, 1, 1);
                targetCamPos.set(0, 40, 220);
                targetLookAt.set(0, 20, 0);
            }
        }

        // --- Các hàm tạo cây, ripple, dust giữ nguyên logic ---
        function createSymmetricalTree() {
            const geometry = new THREE.BufferGeometry();
            const finalPositions = []; const initialPositions = []; const colors = []; const sizes = [];
            const colorObj = new THREE.Color();
            const anglePerBranch = (Math.PI * 2) / CONFIG.branches;
            for (let i = 0; i < CONFIG.layers; i++) {
                const progress = i / (CONFIG.layers - 1);
                const layerYBase = (progress * CONFIG.treeHeight) - (CONFIG.treeHeight / 2);
                const currentMaxRadius = CONFIG.baseRadius * Math.pow(1 - progress, 0.5);
                const count = Math.floor(CONFIG.particlesPerLayer * Math.pow(1 - progress, 1.2));
                const layerOffset = (i % 2) * (anglePerBranch / 2) + (i * 0.1);
                for (let j = 0; j < count; j++) {
                    const branchID = Math.floor(Math.random() * CONFIG.branches);
                    const finalAngle = branchID * anglePerBranch + (Math.random() - 0.5) * anglePerBranch * (0.4 + progress * 0.2) + layerOffset;
                    const rRatio = Math.sqrt(Math.random());
                    const r = currentMaxRadius * rRatio;
                    let y = layerYBase - (r * 0.6) - (rRatio * (1 - progress) * 4.0);
                    finalPositions.push(r * Math.cos(finalAngle), y + (Math.random() - 0.5) * 2.0, r * Math.sin(finalAngle));
                    const startRadius = 250 + Math.random() * 350; const startAngle = Math.random() * Math.PI * 2;
                    initialPositions.push(startRadius * Math.cos(startAngle), (Math.random() - 0.5) * 300, startRadius * Math.sin(startAngle));
                    const mix = Math.random();
                    let h = (mix < 0.65) ? CONFIG.huePink : (mix < 0.85 ? CONFIG.hueGold : CONFIG.hueGreen);
                    colorObj.setHSL(h, 0.9, 0.5); colors.push(colorObj.r, colorObj.g, colorObj.b);
                    sizes.push(Math.random() * 0.7 + 0.4);
                }
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(finalPositions, 3));
            geometry.setAttribute('initialPosition', new THREE.Float32BufferAttribute(initialPositions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            const material = new THREE.ShaderMaterial({
                uniforms: { pointTexture: { value: particleTexture }, time: { value: 0 }, uProgress: { value: 0.0 } },
                vertexShader: `attribute float size; attribute vec3 color; attribute vec3 initialPosition; varying vec3 vColor; uniform float time; uniform float uProgress;
                    void main() { vColor = color; float t = 1.0 - pow(1.0 - uProgress, 3.0); vec3 pos = mix(initialPosition, position, t);
                    pos.x += sin(time * 1.5 + pos.y * 0.05) * 0.5 * smoothstep(0.8, 1.0, uProgress);
                    vec4 mvPos = modelViewMatrix * vec4(pos, 1.0); gl_PointSize = size * (500.0 / -mvPos.z); gl_Position = projectionMatrix * mvPos; }`,
                fragmentShader: `uniform sampler2D pointTexture; varying vec3 vColor; void main() { vec4 tex = texture2D(pointTexture, gl_PointCoord); gl_FragColor = vec4(vColor, 1.0) * tex; if (gl_FragColor.a < 0.05) discard; }`,
                blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
            });
            const tree = new THREE.Points(geometry, material); tree.userData = { isTree: true }; contentGroup.add(tree);
        }

        function createHeart() {
            const geometry = new THREE.BufferGeometry(); const positions = []; const colors = [];
            for (let i = 0; i < 1000; i++) {
                const t = Math.random() * Math.PI * 2; const p = Math.random() * Math.PI;
                const x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(p);
                const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * Math.sin(p);
                positions.push(x * 0.7, y * 0.7, 9 * Math.cos(p) * 0.7);
                const c = new THREE.Color().setHSL(Math.random() > 0.8 ? CONFIG.hueGold : CONFIG.huePink, 1, 0.6);
                colors.push(c.r, c.g, c.b);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const heart = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 2.0, map: particleTexture, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
            heart.position.y = CONFIG.treeHeight / 2 + 5; contentGroup.add(heart); contentGroup.userData.heart = heart;
        }

        function createBigRipples() {
            const ringsGroup = new THREE.Group(); contentGroup.add(ringsGroup);
            const startRadius = 80;
            for (let i = 0; i < 5; i++) {
                const r = startRadius + i * 40; const count = 30000 + i * 5000;
                const geo = new THREE.BufferGeometry(); const pos = []; const cols = [];
                for (let j = 0; j < count; j++) {
                    const angle = Math.random() * Math.PI * 2; const dist = r + (Math.random() - 0.5) * (8 + i * 2);
                    pos.push(dist * Math.cos(angle), -CONFIG.treeHeight / 2 - 5, dist * Math.sin(angle));
                    const c = new THREE.Color().setHSL(0.96, 1, i % 2 === 0 ? 0.4 : 0.8); cols.push(c.r, c.g, c.b);
                }
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
                const ring = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.8, vertexColors: true, map: particleTexture, blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false }));
                ring.userData = { rotationSpeed: i % 2 === 0 ? 0.01 : -0.01, targetOpacity: 0.6, delay: (4 - i) * 0.8 }; ringsGroup.add(ring);
            }
            contentGroup.userData.rings = ringsGroup;
        }

        function createBackgroundDust() {
            const geo = new THREE.BufferGeometry(); const pos = []; const cols = [];
            for (let i = 0; i < 30000; i++) {
                const r = Math.random() * 450; const theta = Math.random() * Math.PI * 2;
                pos.push(r * Math.cos(theta), (Math.random() - 0.5) * 250, r * Math.sin(theta));
                const c = new THREE.Color().setHSL(0.95, 0.5, 0.3); cols.push(c.r, c.g, c.b);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
            contentGroup.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.5, vertexColors: true, map: particleTexture, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.3, depthWrite: false })));
        }

        function createFallingSnow() {
            const geo = new THREE.BufferGeometry(); const pos = []; const vels = [];
            for (let i = 0; i < CONFIG.snowCount; i++) {
                pos.push((Math.random() - 0.5) * CONFIG.snowRange, (Math.random() - 0.5) * CONFIG.snowRange, (Math.random() - 0.5) * CONFIG.snowRange);
                vels.push(0.2 + Math.random() * 0.6);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('velocity', new THREE.Float32BufferAttribute(vels, 1));
            snowSystem = new THREE.Points(geo, new THREE.PointsMaterial({ size: 3.5, map: snowflakeTexture, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
            scene.add(snowSystem);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
            calculateLayoutTargets();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Nhạc tự động phát
            if (!musicStarted && time >= CONFIG.treeStartTimeOffset) {
                music.play().catch(e => console.log("Music blocked"));
                musicStarted = true;
            }

            if (time < CONFIG.introDuration) {
                const lerpSpeed = 0.02; camera.position.lerp(targetCamPos, lerpSpeed);
                controls.target.lerp(targetLookAt, lerpSpeed); controls.update();
            } else if (!isIntroFinished) {
                isIntroFinished = true; controls.enabled = true;
            } else {
                controls.update();
            }

            if (snowSystem) {
                const pos = snowSystem.geometry.attributes.position.array;
                const vels = snowSystem.geometry.attributes.velocity.array;
                for (let i = 0; i < CONFIG.snowCount; i++) {
                    const i3 = i * 3; pos[i3 + 1] -= vels[i];
                    if (pos[i3 + 1] < -CONFIG.snowRange / 2) pos[i3 + 1] = CONFIG.snowRange / 2;
                }
                snowSystem.geometry.attributes.position.needsUpdate = true;
                snowSystem.rotation.y = time * 0.05;
            }

            if (contentGroup.userData.rings) {
                contentGroup.userData.rings.children.forEach(ring => {
                    ring.rotation.y = time * ring.userData.rotationSpeed;
                    if (time > ring.userData.delay) ring.material.opacity = Math.min((time - ring.userData.delay) * 0.5, 1.0) * ring.userData.targetOpacity;
                });
            }

            if (time > CONFIG.treeStartTimeOffset) {
                const progress = Math.min((time - CONFIG.treeStartTimeOffset) / CONFIG.treeCoalesceSpeed, 1.0);
                contentGroup.children.forEach(child => {
                    if (child.userData.isTree) { child.material.uniforms.time.value = time; child.material.uniforms.uProgress.value = progress; }
                });

                if (progress > 0.8) {
                    const baseOpacity = (progress - 0.8) / 0.2;
                    textGroup.children.forEach(child => { if (child.userData.isTitle) child.material.opacity = baseOpacity; });

                    if (activeSubtitles.length === 0 && currentSubtitleIndex === 0 && time - lastSubtitleSwitchTime > 1.0) {
                        spawnSubtitle(CONFIG.subtitles[0]); lastSubtitleSwitchTime = time;
                    }

                    if (time - lastSubtitleSwitchTime > CONFIG.subtitleSwitchTime) {
                        const currentActive = activeSubtitles.find(s => s.state === 'entering');
                        if (currentActive) currentActive.state = 'exiting';
                        currentSubtitleIndex = (currentSubtitleIndex + 1) % CONFIG.subtitles.length;
                        spawnSubtitle(CONFIG.subtitles[currentSubtitleIndex]);
                        lastSubtitleSwitchTime = time;
                    }

                    for (let i = activeSubtitles.length - 1; i >= 0; i--) {
                        const item = activeSubtitles[i]; const mesh = item.mesh;
                        if (item.state === 'entering') {
                            mesh.position.y += (-25 - mesh.position.y) * 0.05; mesh.material.opacity += (1 - mesh.material.opacity) * 0.05;
                        } else if (item.state === 'exiting') {
                            mesh.position.y += 0.15; mesh.material.opacity -= 0.03;
                            if (mesh.material.opacity <= 0) { subtitleGroup.remove(mesh); activeSubtitles.splice(i, 1); }
                        }
                    }
                }
            }

            if (contentGroup.userData.heart) {
                const s = 1 + Math.sin(time * 3) * 0.1; contentGroup.userData.heart.scale.set(s, s, s);
            }
            composer.render();
        }
    </script>
</body>

</html>
