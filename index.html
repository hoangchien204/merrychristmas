<!DOCTYPE html>
<html lang="VN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOEL_V3_FINAL_HEARTBEAT_ONLY</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Times New Roman', serif;
            touch-action: none; 
        }

        #canvas-container {
            width: 100vw;
            height: 100dvh; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            text-align: center;
        }

        .status-badge {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #FFD700;
            color: #FFD700;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            white-space: nowrap;
        }

        .guide-text {
            color: #ccc;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 2px 4px black;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            max-width: 90%;
            line-height: 1.5;
        }

        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .upload-wrapper {
            pointer-events: auto;
            margin-top: 15px;
        }

        .upload-btn {
            background: #8B0000;
            border: 1px solid #FFD700;
            color: #fff;
            padding: 10px 25px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .upload-btn:hover {
            background: #FF0000;
            box-shadow: 0 0 15px #FF0000;
        }

        #file-input { display: none; }
        #webcam-preview { display: none !important; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="color: #FFD700; margin-top: 20px;">Đang tải hiệu ứng Giáng Sinh...</p>
    </div>

    <div id="canvas-container"></div>
    <canvas id="webcam-preview"></canvas> 
    <video id="webcam" autoplay playsinline style="display:none;"></video>

    <div id="ui-layer">
        <div id="status-text" class="status-badge">🎄 Waiting for Camera 🎄</div>
        <div class="guide-text">✊Nắm: Cây | 🖐Xòe: Bung | 👌Pinch: Xem Ảnh | 🫶2 Tay: Thả Tim</div>
        <div class="upload-wrapper">
            <label class="upload-btn">Thêm Ảnh<input type="file" id="file-input" multiple accept="image/*"></label>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        const DEFAULT_ALBUM = [
            'anh-giang-sinh-34.jpg',
            'anh-giang-sinh-37.jpg',
            'anh-giang-sinh-53.jpg',
            'cho.jpg',
            'meo.jpg',
        ];
        let hasUserUploaded = false; 

        const CONFIG = {
            colors: {
                bg: 0x050505,
                gold: 0xffd700,
                red: 0xff0000,
                gift: 0xff3333
            },
            particles: {
                count: 1800, 
                treeHeight: 120,
                treeRadius: 40
            },
            camera: { z: 120 }
        };

        const STATE = {
            mode: 'TREE',
            focusTarget: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 }
        };

        let scene, camera, renderer, composer, bloomPass;
        let mainGroup, loveTextGroup, photoGroup;
        let starMesh;
        let clock = new THREE.Clock();
        let particleSystem = [];
        let handLandmarker, video;
        let giftTexture;

        async function init() {
            initThree();
            setupLights();
            createTextures();
            createParticles();
            createLoveText();
            createStar();
            setupPostProcessing();
            setupEvents();
            loadDefaultAlbum();
            await initMediaPipe();

            const l = document.getElementById('loader');
            l.style.opacity = 0; setTimeout(() => l.remove(), 800);
            animate();
        }

        function loadDefaultAlbum() {
            if (hasUserUploaded) return;
            const loader = new THREE.TextureLoader();
            loader.setCrossOrigin('anonymous'); 
            DEFAULT_ALBUM.forEach(url => {
                loader.load(url, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    if (!hasUserUploaded) addPhoto(texture, false); 
                });
            });
        }

        function clearAllPhotos() {
            for (let i = photoGroup.children.length - 1; i >= 0; i--) {
                const mesh = photoGroup.children[i];
                if(mesh.material.map) mesh.material.map.dispose();
                if(mesh.material) mesh.material.dispose();
                if(mesh.geometry) mesh.geometry.dispose();
                photoGroup.remove(mesh);
            }
            particleSystem = particleSystem.filter(p => p.type !== 'PHOTO');
            STATE.focusTarget = null;
            if (STATE.mode === 'FOCUS') STATE.mode = 'TREE';
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.005);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            photoGroup = new THREE.Group();
            mainGroup.add(photoGroup);

            loveTextGroup = new THREE.Group();
            mainGroup.add(loveTextGroup);
            loveTextGroup.visible = false;
        }

        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) {
                camera.position.set(0, 20, 120 / aspect * 0.8); 
            } else {
                camera.position.set(0, 20, 120);
            }
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const pLight = new THREE.PointLight(0xffaa00, 2, 100);
            pLight.position.set(0, 30, 30);
            mainGroup.add(pLight);
            const rLight = new THREE.PointLight(0xff0000, 1.5, 80);
            rLight.position.set(0, -20, 30);
            mainGroup.add(rLight);
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.35;
            bloomPass.strength = 2.0;
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function createTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createLinearGradient(0, 0, 128, 128);
            grd.addColorStop(0, '#ff4444'); grd.addColorStop(1, '#aa0000');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#FFFD91'; ctx.fillRect(54, 0, 20, 128); ctx.fillRect(0, 54, 128, 20);
            giftTexture = new THREE.CanvasTexture(canvas);
        }

        function createLoveText() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = '900 110px "Arial Black", sans-serif';
            ctx.fillStyle = '#FF1493'; ctx.textAlign = 'center';
            ctx.shadowColor = "#FF69B4"; ctx.shadowBlur = 50;
            ctx.fillText("I LOVE YOU ❤️", 512, 160);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(60, 15, 1);
            sprite.position.set(0, 25, 15);
            loveTextGroup.add(sprite);
        }

        function createStar() {
            const starShape = new THREE.Shape();
            const outerRadius = 5;
            const innerRadius = 2.5;
            const points = 5;
            starShape.moveTo(0, outerRadius);
            for (let i = 1; i <= points * 2; i++) {
                const angle = (i * Math.PI) / points;
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                starShape.lineTo(Math.sin(angle) * r, Math.cos(angle) * r);
            }
            starShape.closePath();
            const geo = new THREE.ExtrudeGeometry(starShape, { steps: 1, depth: 1.5, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.5, bevelSegments: 2 });
            geo.center();
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffd700, 
                emissive: 0xffff00, 
                emissiveIntensity: 0.6,
                metalness: 0.8, roughness: 0.2
            });
            starMesh = new THREE.Mesh(geo, mat);
            starMesh.position.set(0, CONFIG.particles.treeHeight / 2 + 3, 0);
            mainGroup.add(starMesh);
        }

        class Particle {
            constructor(mesh, type) {
                this.mesh = mesh; this.type = type;
                this.posTree = new THREE.Vector3(); this.posScatter = new THREE.Vector3(); this.posHeart = new THREE.Vector3();
                this.baseScale = mesh.scale.x; 
                this.calculatePositions();
                this.rotSpeed = { x: Math.random() - 0.5, y: Math.random() - 0.5 };
                if (type === 'PHOTO') this.posScatter.copy(mesh.position);
            }

            calculatePositions() {
                // 1. Cây Thông (Tree)
                const h = Math.random() * CONFIG.particles.treeHeight;
                const y = h - CONFIG.particles.treeHeight / 2;
                const rRatio = (1 - (h / CONFIG.particles.treeHeight));
                const rMax = rRatio * CONFIG.particles.treeRadius;
                const radiusMult = (this.type === 'GOLD') ? Math.sqrt(Math.random()) : (0.9 + Math.random() * 0.2);
                const r = rMax * radiusMult;
                const theta = Math.random() * Math.PI * 2 + h * 0.15;
                this.posTree.set(r * Math.cos(theta), y, r * Math.sin(theta));

                // 2. Bung Tỏa (Scatter)
                if (this.type !== 'PHOTO') {
                    const rScatter = 40 + Math.random() * 30;
                    const phi = Math.acos(-1 + (2 * Math.random()));
                    const tScatter = Math.sqrt(Math.PI * 180 * Math.random()) * phi;
                    this.posScatter.setFromSphericalCoords(rScatter, phi, tScatter);
                }

                // 3. Trái Tim (Heart)
                const tHeart = Math.random() * Math.PI * 2;
                let hx = 16 * Math.pow(Math.sin(tHeart), 3);
                let hy = 13 * Math.cos(tHeart) - 5 * Math.cos(2 * tHeart) - 2 * Math.cos(3 * tHeart) - Math.cos(4 * tHeart);
                const heartScale = 3.5; 
                const fill = 0.8 + Math.random() * 0.2; 
                this.posHeart.set(hx * heartScale * fill, (hy * heartScale * fill) + 30, (Math.random() - 0.5) * 4);
            }

            update(dt, mode, focusTarget) {
                let target = this.posTree; let s = this.baseScale; let moveSpeed = 3.0;

                if (mode === 'SCATTER') {
                    target = this.posScatter; s = (this.type === 'PHOTO') ? 1.0 : this.baseScale;
                } else if (mode === 'HEART') {
                    
                    // === LOGIC NHỊP TIM (HEARTBEAT) ===
                    const time = clock.elapsedTime;
                    // Nhịp đập: nhanh và giật (beat)
                    const beat = 1 + 0.15 * Math.pow((Math.sin(time * 5) + 1) / 2, 8); 

                    let pulsedTarget = this.posHeart.clone();
                    // Các hạt tim: Phóng to từ tâm (0, 30, 0)
                    pulsedTarget.sub(new THREE.Vector3(0, 30, 0)); // Dời về gốc
                    pulsedTarget.multiplyScalar(beat);             // Scale lên
                    pulsedTarget.add(new THREE.Vector3(0, 30, 0)); // Dời lại chỗ cũ
                    target = pulsedTarget;

                    s = this.baseScale * 0.7; 
                    if (this.type === 'PHOTO') s = 0;

                } else if (mode === 'FOCUS') {
                    if (this.type === 'PHOTO') {
                        if (this.mesh === focusTarget) {
                            const camFrontWorld = camera.position.clone().add(new THREE.Vector3(0, 0, -40).applyQuaternion(camera.quaternion));
                            target = mainGroup.worldToLocal(camFrontWorld); s = 5.0; moveSpeed = 5.0; this.mesh.lookAt(camera.position);
                        } else { target = this.posScatter; s = 0.5; }
                    } else { 
                        target = this.posScatter; 
                        s = this.baseScale * 0.2;
                    }
                } else {
                    if (this.type === 'PHOTO') s = 0;
                    if (this.type === 'RED') s = this.baseScale * (0.8 + 0.3 * Math.sin(clock.elapsedTime * 3 + this.mesh.id));
                }
                this.mesh.position.lerp(target, moveSpeed * dt); this.mesh.scale.lerp(new THREE.Vector3(s, s, s), moveSpeed * dt);
                if (mode === 'SCATTER' && this.type !== 'PHOTO') {
                    this.mesh.rotation.x += this.rotSpeed.x * dt; this.mesh.rotation.y += this.rotSpeed.y * dt;
                } else if (mode === 'TREE') { this.mesh.rotation.y += 0.01; }
            }
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.6, 16, 16); const boxGeo = new THREE.BoxGeometry(1, 1, 1);

            for (let i = 0; i < CONFIG.particles.count; i++) {
                let mesh, type; const rand = Math.random();
                if (rand < 0.12) {
                    const matGift = new THREE.MeshStandardMaterial({ map: giftTexture, emissive: `#F02A09`, emissiveIntensity: 0.6, roughness: 0.3 });
                    mesh = new THREE.Mesh(boxGeo, matGift); type = 'GIFT'; mesh.scale.set(1.8, 1.8, 1.8);
                } else if (rand < 0.35) {
                    const matRed = new THREE.MeshStandardMaterial({ color: CONFIG.colors.red, emissive: 0xff0000, emissiveIntensity: 2.0, roughness: 0.3 });
                    mesh = new THREE.Mesh(sphereGeo, matRed); type = 'RED'; const s = 0.6 + Math.random() * 0.4; mesh.scale.set(s, s, s);
                } else {
                    const matGold = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, emissive: 0xffd700, emissiveIntensity: 1.5, roughness: 0.2 });
                    mesh = new THREE.Mesh(sphereGeo, matGold); type = 'GOLD'; const s = 0.4 + Math.random() * 0.5; mesh.scale.set(s, s, s);
                }
                mainGroup.add(mesh); 
                particleSystem.push(new Particle(mesh, type));
            }
        }

        function addPhoto(texture, forceFocus = true) {
            const ratio = texture.image.width / texture.image.height; const h = 5; const w = h * ratio;
            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true
            }); 
            
            const mesh = new THREE.Mesh(geo, mat);
            const bGeo = new THREE.PlaneGeometry(w + 0.3, h + 0.3); const bMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700, emissiveIntensity: 0.5 });
            const border = new THREE.Mesh(bGeo, bMat); border.position.z = -0.02; mesh.add(border);
            mesh.position.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 20); mesh.scale.set(0, 0, 0);
            photoGroup.add(mesh); particleSystem.push(new Particle(mesh, 'PHOTO'));
            
            if (forceFocus) {
                STATE.mode = 'FOCUS'; STATE.focusTarget = mesh;
            }
        }

        async function initMediaPipe() {
            video = document.getElementById('webcam');
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                runningMode: "VIDEO", numHands: 2
            });
            if (navigator.mediaDevices?.getUserMedia) {
                const constraints = { 
                    video: { 
                        facingMode: "user", 
                        width: { ideal: 640 }, 
                        height: { ideal: 480 } 
                    } 
                };
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream; video.addEventListener("loadeddata", predictWebcam);
                } catch (err) {
                    console.error("Camera error:", err);
                    document.getElementById('status-text').innerText = "❌ Lỗi Camera (Cần HTTPS) ❌";
                }
            }
        }

        let lastVideoTime = -1;
        function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    const cvs = document.getElementById('webcam-preview'); 
                    cvs.width = video.videoWidth; cvs.height = video.videoHeight;
                    processLogic(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processLogic(result) {
            const statusDiv = document.getElementById('status-text'); const landmarks = result.landmarks;
            if (!landmarks || landmarks.length === 0) { if (STATE.mode === 'HEART' || STATE.mode === 'FOCUS') STATE.mode = 'TREE'; return; }
            STATE.hand.detected = true;
            if (landmarks.length === 2) {
                const h1 = landmarks[0]; const h2 = landmarks[1];
                const distIndex = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
                const distThumb = Math.hypot(h1[4].x - h2[4].x, h1[4].y - h2[4].y);
                if (distIndex < 0.18 && distThumb < 0.18) {
                    STATE.mode = 'HEART'; statusDiv.innerText = "❤️ I LOVE YOU ❤️"; statusDiv.style.color = "#FF69B4"; statusDiv.style.borderColor = "#FF69B4"; return;
                }
            }
            const lm = landmarks[0]; STATE.hand.x = (1.0 - lm[9].x); STATE.hand.y = lm[9].y;
            const wrist = lm[0]; const tips = [8, 12, 16, 20]; let avgSpread = 0;
            tips.forEach(i => avgSpread += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y)); avgSpread /= 4;
            const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
            if (pinchDist < 0.06) {
                if (photoGroup.children.length > 0) {
                    if (STATE.mode !== 'FOCUS') {
                        STATE.mode = 'FOCUS';
                        if (!STATE.focusTarget || !photoGroup.children.includes(STATE.focusTarget)) {
                            const photos = photoGroup.children; STATE.focusTarget = photos[Math.floor(Math.random() * photos.length)];
                        }
                    }
                }
            } else if (avgSpread < 0.28) {
                STATE.mode = 'TREE'; STATE.focusTarget = null; statusDiv.innerText = "🎄 Cây Thông Noel 🎄"; statusDiv.style.color = "#FFD700"; statusDiv.style.borderColor = "#FFD700";
            } else {
                STATE.mode = 'SCATTER'; STATE.focusTarget = null; statusDiv.innerText = "✨ Bung Tỏa ✨"; statusDiv.style.color = "#FFA500"; statusDiv.style.borderColor = "#FFA500";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const targetBloomStrength = (STATE.mode === 'FOCUS') ? 0 : 2.0;
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, targetBloomStrength, 0.05);

            if ((STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') && STATE.hand.detected) {
                const tx = (STATE.hand.y - 0.5) * 2.5; const ty = (STATE.hand.x - 0.5) * 5.0;
                STATE.rotation.x += (tx - STATE.rotation.x) * 3 * dt; STATE.rotation.y += (ty - STATE.rotation.y) * 3 * dt;
            } else if (STATE.mode === 'TREE') {
                STATE.rotation.x *= 0.95; STATE.rotation.y += 0.2 * dt;
            } else if (STATE.mode === 'HEART') {
                STATE.rotation.x *= 0.95; STATE.rotation.y *= 0.95;
            }

            mainGroup.rotation.x = STATE.rotation.x; mainGroup.rotation.y = STATE.rotation.y;
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));

            if (STATE.mode === 'HEART') {
                loveTextGroup.visible = true; starMesh.visible = false;
                const s = 1.2 + Math.sin(clock.elapsedTime * 5) * 0.1;
                loveTextGroup.scale.set(s, s, 1); loveTextGroup.lookAt(camera.position);
            } else if (STATE.mode === 'TREE') {
                loveTextGroup.visible = false; starMesh.visible = true;
                starMesh.rotation.y += dt * 0.5;
                starMesh.rotation.z = Math.sin(clock.elapsedTime) * 0.1;
            } else {
                loveTextGroup.visible = false; starMesh.visible = false;
            }

            composer.render();
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix(); 
                updateCameraPosition();
                renderer.setSize(window.innerWidth, window.innerHeight); 
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.getElementById('file-input').addEventListener('change', (e) => {
                if (!hasUserUploaded) {
                    clearAllPhotos();
                    hasUserUploaded = true;
                }
                Array.from(e.target.files).forEach(f => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        new THREE.TextureLoader().load(ev.target.result, (t) => {
                            t.colorSpace = THREE.SRGBColorSpace; 
                            addPhoto(t, true); 
                        });
                    }
                    reader.readAsDataURL(f);
                });
            });
        }

        init();
    </script>
</body>

</html>
